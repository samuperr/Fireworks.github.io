<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fireworks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a12;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #startBtn {
      position: relative;
      z-index: 10;
      padding: 18px 48px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #ff4d6d, #ff8c42);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.4);
      transition: all 0.25s ease;
    }
    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(255, 77, 109, 0.6);
    }
    #startBtn.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="startBtn">Start</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');

    let w, h;
    let particles = [];
    let rockets = [];
    let running = false;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, color, velocity, type = 'spark') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.velocity = velocity;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.01;
        this.type = type;
        this.size = type === 'spark' ? Math.random() * 2 + 1 : Math.random() * 3 + 2;
      }

      update() {
        this.velocity.x *= 0.99;
        this.velocity.y *= 0.99;
        this.velocity.y += 0.05; // gravity
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class Rocket {
      constructor() {
        this.x = Math.random() * w * 0.8 + w * 0.1;
        this.y = h;
        this.targetY = Math.random() * h * 0.4 + h * 0.1;
        this.velocity = { x: (Math.random() - 0.5) * 2, y: -(Math.random() * 6 + 10) };
        this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
        this.exploded = false;
      }

      update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.velocity.y += 0.12;

        // trail
        if (Math.random() > 0.6) {
          particles.push(new Particle(
            this.x,
            this.y,
            this.color,
            { x: (Math.random() - 0.5) * 1, y: Math.random() * 2 },
            'trail'
          ));
        }

        if (this.y <= this.targetY || this.velocity.y >= 0) {
          this.explode();
        }
      }

      explode() {
        this.exploded = true;
        const count = 60 + Math.floor(Math.random() * 40);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count;
          const speed = Math.random() * 6 + 2;
          particles.push(new Particle(
            this.x,
            this.y,
            this.color,
            {
              x: Math.cos(angle) * speed,
              y: Math.sin(angle) * speed
            }
          ));
        }
      }

      draw() {
        if (!this.exploded) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }
      }
    }

    function launch() {
      if (Math.random() < 0.04) {
        rockets.push(new Rocket());
      }
    }

    function animate() {
      if (!running) return;

      ctx.fillStyle = 'rgba(10, 10, 18, 0.2)';
      ctx.fillRect(0, 0, w, h);

      launch();

      // rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update();
        rockets[i].draw();
        if (rockets[i].exploded) rockets.splice(i, 1);
      }

      // particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    startBtn.addEventListener('click', () => {
      startBtn.classList.add('hidden');
      running = true;
      animate();
    });
  </script>
</body>
</html>
